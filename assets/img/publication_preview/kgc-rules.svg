<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img">
  <title>Logical rules inferring a missing knowledge-graph edge</title>
  <defs>
    <pattern id="dots-kgc" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="23" cy="23" r="1.6" fill="#1E293B"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="#0F172A"/>
  <rect width="600" height="450" fill="url(#dots-kgc)"/>
  <!-- known edges -->
  <g stroke="#475569" stroke-width="3.5" stroke-linecap="round">
    <line x1="150" y1="150" x2="308" y2="95"/>
    <line x1="308" y1="95" x2="462" y2="168"/>
    <line x1="150" y1="150" x2="212" y2="330"/>
    <line x1="462" y1="168" x2="425" y2="322"/>
    <line x1="212" y1="330" x2="425" y2="322"/>
    <line x1="308" y1="95" x2="425" y2="322" opacity="0.5"/>
  </g>
  <!-- inferred edge -->
  <line x1="150" y1="150" x2="462" y2="168" stroke="#818CF8" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 16"/>
  <!-- nodes -->
  <g fill="#E2E8F0">
    <circle cx="308" cy="95" r="7"/>
    <circle cx="212" cy="330" r="7"/>
    <circle cx="425" cy="322" r="7"/>
  </g>
  <circle cx="150" cy="150" r="11" fill="none" stroke="#818CF8" stroke-width="4"/>
  <circle cx="462" cy="168" r="11" fill="none" stroke="#818CF8" stroke-width="4"/>
  <rect x="30" y="400" width="34" height="6" rx="3" fill="#818CF8"/>
</svg>
