<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img">
  <title>TreeReg: a syntax tree guiding transformer token representations</title>
  <defs>
    <pattern id="dots-treereg" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="23" cy="23" r="1.6" fill="#1E293B"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="#0F172A"/>
  <rect width="600" height="450" fill="url(#dots-treereg)"/>
  <!-- tree edges -->
  <g stroke="#4F46E5" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="300" y1="112" x2="190" y2="205"/>
    <line x1="300" y1="112" x2="410" y2="205"/>
    <line x1="190" y1="205" x2="130" y2="298"/>
    <line x1="190" y1="205" x2="250" y2="298"/>
    <line x1="410" y1="205" x2="350" y2="298"/>
    <line x1="410" y1="205" x2="470" y2="298"/>
  </g>
  <!-- nodes -->
  <circle cx="300" cy="105" r="12" fill="none" stroke="#818CF8" stroke-width="4"/>
  <circle cx="190" cy="205" r="8" fill="#818CF8"/>
  <circle cx="410" cy="205" r="8" fill="#818CF8"/>
  <!-- token squares at the leaves -->
  <g fill="none" stroke="#64748B" stroke-width="3.5">
    <rect x="112" y="306" width="36" height="36" rx="8"/>
    <rect x="232" y="306" width="36" height="36" rx="8"/>
    <rect x="332" y="306" width="36" height="36" rx="8"/>
    <rect x="452" y="306" width="36" height="36" rx="8"/>
  </g>
  <!-- soft glow accents on two tokens the tree binds together -->
  <rect x="232" y="306" width="36" height="36" rx="8" fill="#818CF8" opacity="0.18"/>
  <rect x="332" y="306" width="36" height="36" rx="8" fill="#818CF8" opacity="0.18"/>
  <rect x="30" y="400" width="34" height="6" rx="3" fill="#818CF8"/>
</svg>
