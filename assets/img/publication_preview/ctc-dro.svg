<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img">
  <title>CTC-DRO: equalizing speech recognition across languages</title>
  <defs>
    <pattern id="dots-ctc" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="23" cy="23" r="1.6" fill="#1E293B"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="#0F172A"/>
  <rect width="600" height="450" fill="url(#dots-ctc)"/>
  <!-- three language waveforms, unequal -->
  <g stroke="#64748B" stroke-width="4.5" stroke-linecap="round">
    <line x1="85" y1="88" x2="85" y2="132"/>
    <line x1="113" y1="70" x2="113" y2="150"/>
    <line x1="141" y1="92" x2="141" y2="128"/>
    <line x1="169" y1="100" x2="169" y2="120"/>

    <line x1="85" y1="207" x2="85" y2="243"/>
    <line x1="113" y1="196" x2="113" y2="254"/>
    <line x1="141" y1="211" x2="141" y2="239"/>
    <line x1="169" y1="217" x2="169" y2="233"/>

    <line x1="85" y1="336" x2="85" y2="354"/>
    <line x1="113" y1="330" x2="113" y2="360"/>
    <line x1="141" y1="338" x2="141" y2="352"/>
    <line x1="169" y1="341" x2="169" y2="349"/>
  </g>
  <!-- convergence -->
  <g stroke="#FB7185" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M225 110 C 320 110 330 200 405 219"/>
    <path d="M225 225 L 400 225"/>
    <path d="M225 345 C 320 345 330 250 405 231"/>
  </g>
  <!-- equalized bars -->
  <g stroke="#FB7185" stroke-width="6" stroke-linecap="round">
    <line x1="452" y1="185" x2="452" y2="265"/>
    <line x1="484" y1="185" x2="484" y2="265"/>
    <line x1="516" y1="185" x2="516" y2="265"/>
  </g>
  <rect x="30" y="400" width="34" height="6" rx="3" fill="#FB7185"/>
</svg>
