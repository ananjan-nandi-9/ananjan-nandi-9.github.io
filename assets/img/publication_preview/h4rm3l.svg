<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img">
  <title>h4rm3l: composed jailbreak programs probing a model's defenses</title>
  <defs>
    <pattern id="dots-h4" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="23" cy="23" r="1.6" fill="#1E293B"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="#0F172A"/>
  <rect width="600" height="450" fill="url(#dots-h4)"/>
  <!-- composed attack blocks -->
  <g fill="none" stroke-width="3.5">
    <rect x="82" y="203" width="44" height="44" rx="9" stroke="#64748B"/>
    <rect x="170" y="203" width="44" height="44" rx="9" stroke="#FB7185"/>
    <rect x="258" y="203" width="44" height="44" rx="9" stroke="#64748B"/>
  </g>
  <!-- composition dots -->
  <g fill="#FB7185">
    <circle cx="148" cy="225" r="4.5"/>
    <circle cx="236" cy="225" r="4.5"/>
  </g>
  <!-- probe line into the shield -->
  <line x1="302" y1="225" x2="392" y2="225" stroke="#FB7185" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 14"/>
  <!-- shield -->
  <path d="M462 138 C 482 150 502 155 518 155 C 518 233 495 279 462 300 C 429 279 406 233 406 155 C 422 155 442 150 462 138 Z"
        fill="none" stroke="#E2E8F0" stroke-width="4"/>
  <!-- crack -->
  <path d="M462 172 L451 214 L470 222 L456 264" stroke="#FB7185" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="30" y="400" width="34" height="6" rx="3" fill="#FB7185"/>
</svg>
