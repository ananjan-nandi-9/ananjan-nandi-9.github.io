<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img">
  <title>DynaSemble: dynamically weighted ensemble of models</title>
  <defs>
    <pattern id="dots-dyna" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="23" cy="23" r="1.6" fill="#1E293B"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="#0F172A"/>
  <rect width="600" height="450" fill="url(#dots-dyna)"/>
  <!-- three models -->
  <g fill="none" stroke="#64748B" stroke-width="3.5">
    <rect x="100" y="88" width="52" height="52" rx="10"/>
    <rect x="100" y="199" width="52" height="52" rx="10"/>
    <rect x="100" y="310" width="52" height="52" rx="10"/>
  </g>
  <!-- weighted flows: thickness encodes the dynamic weight -->
  <g fill="none" stroke="#818CF8" stroke-linecap="round">
    <path d="M158 114 C 280 114 330 190 424 216" stroke-width="9"/>
    <path d="M158 225 C 260 225 330 225 420 225" stroke-width="5" opacity="0.75"/>
    <path d="M158 336 C 280 336 330 260 424 234" stroke-width="2.5" opacity="0.55"/>
  </g>
  <!-- ensembled predictor -->
  <circle cx="458" cy="225" r="30" fill="none" stroke="#818CF8" stroke-width="4.5"/>
  <circle cx="458" cy="225" r="9" fill="#E2E8F0"/>
  <rect x="30" y="400" width="34" height="6" rx="3" fill="#818CF8"/>
</svg>
