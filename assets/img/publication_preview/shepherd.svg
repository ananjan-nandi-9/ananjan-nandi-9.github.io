<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img">
  <title>Shepherd: a reversible agent execution trace</title>
  <defs>
    <pattern id="dots-shep" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="23" cy="23" r="1.6" fill="#1E293B"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="#0F172A"/>
  <rect width="600" height="450" fill="url(#dots-shep)"/>
  <!-- execution trace -->
  <g stroke="#64748B" stroke-width="3.5" stroke-linecap="round" fill="none">
    <line x1="95" y1="300" x2="505" y2="300"/>
    <path d="M265 300 C 305 300 315 228 365 228 L 448 228"/>
  </g>
  <!-- trace nodes -->
  <g fill="#E2E8F0">
    <circle cx="120" cy="300" r="7"/>
    <circle cx="410" cy="300" r="7"/>
    <circle cx="505" cy="300" r="7"/>
    <circle cx="448" cy="228" r="6"/>
  </g>
  <circle cx="265" cy="300" r="11" fill="none" stroke="#FBBF24" stroke-width="4"/>
  <!-- crook-shaped rewind -->
  <path d="M472 132 C 472 92 388 78 296 92 C 222 103 172 124 168 158"
        stroke="#FBBF24" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M140 132 L168 164 L200 138" stroke="#FBBF24" stroke-width="4.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="30" y="400" width="34" height="6" rx="3" fill="#FBBF24"/>
</svg>
