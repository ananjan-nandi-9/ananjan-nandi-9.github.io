<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img">
  <title>A participatory water-security tool for rural India</title>
  <defs>
    <pattern id="dots-water" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="23" cy="23" r="1.6" fill="#1E293B"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="#0F172A"/>
  <rect width="600" height="450" fill="url(#dots-water)"/>
  <!-- drop -->
  <path d="M300 78 C 344 148 376 192 376 240 A 76 76 0 0 1 224 240 C 224 192 256 148 300 78 Z"
        fill="none" stroke="#2DD4BF" stroke-width="4.5"/>
  <path d="M262 244 a38 38 0 0 0 38 38" stroke="#2DD4BF" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- field contours -->
  <g stroke="#64748B" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M70 352 Q 300 322 530 352"/>
    <path d="M110 386 Q 300 358 490 386" opacity="0.7"/>
    <path d="M150 418 Q 300 394 450 418" opacity="0.45"/>
  </g>
  <!-- community -->
  <g fill="#2DD4BF" opacity="0.85">
    <circle cx="150" cy="170" r="6"/>
    <circle cx="450" cy="170" r="6"/>
    <circle cx="122" cy="216" r="4.5"/>
    <circle cx="478" cy="216" r="4.5"/>
  </g>
  <rect x="30" y="400" width="34" height="6" rx="3" fill="#2DD4BF"/>
</svg>
