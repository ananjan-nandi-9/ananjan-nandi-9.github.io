<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img">
  <title>Hierarchical land use and land cover classification from satellite data</title>
  <defs>
    <pattern id="dots-lulc" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="23" cy="23" r="1.6" fill="#1E293B"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="#0F172A"/>
  <rect width="600" height="450" fill="url(#dots-lulc)"/>
  <!-- satellite patch grid -->
  <g stroke="#475569" stroke-width="2.5" fill="none">
    <rect x="80" y="110" width="58" height="58" rx="8"/>
    <rect x="148" y="110" width="58" height="58" rx="8"/>
    <rect x="216" y="110" width="58" height="58" rx="8"/>
    <rect x="80" y="178" width="58" height="58" rx="8"/>
    <rect x="148" y="178" width="58" height="58" rx="8"/>
    <rect x="216" y="178" width="58" height="58" rx="8"/>
    <rect x="80" y="246" width="58" height="58" rx="8"/>
    <rect x="148" y="246" width="58" height="58" rx="8"/>
    <rect x="216" y="246" width="58" height="58" rx="8"/>
  </g>
  <!-- classified patches, muted earth and water tones -->
  <rect x="148" y="110" width="58" height="58" rx="8" fill="#2DD4BF" opacity="0.35"/>
  <rect x="80" y="178" width="58" height="58" rx="8" fill="#A3E635" opacity="0.3"/>
  <rect x="216" y="246" width="58" height="58" rx="8" fill="#38BDF8" opacity="0.35"/>
  <rect x="216" y="178" width="58" height="58" rx="8" fill="#D6BE8A" opacity="0.3"/>
  <!-- hierarchical classifier -->
  <g stroke="#64748B" stroke-width="3.5" stroke-linecap="round">
    <line x1="440" y1="130" x2="395" y2="215"/>
    <line x1="440" y1="130" x2="485" y2="215"/>
    <line x1="395" y1="215" x2="370" y2="300"/>
    <line x1="395" y1="215" x2="420" y2="300"/>
    <line x1="485" y1="215" x2="510" y2="300"/>
  </g>
  <circle cx="440" cy="122" r="11" fill="none" stroke="#2DD4BF" stroke-width="4"/>
  <circle cx="395" cy="215" r="7" fill="#E2E8F0"/>
  <circle cx="485" cy="215" r="7" fill="#E2E8F0"/>
  <circle cx="370" cy="305" r="7" fill="#A3E635" opacity="0.8"/>
  <circle cx="420" cy="305" r="7" fill="#D6BE8A" opacity="0.8"/>
  <circle cx="510" cy="305" r="7" fill="#38BDF8" opacity="0.8"/>
  <rect x="30" y="400" width="34" height="6" rx="3" fill="#2DD4BF"/>
</svg>
