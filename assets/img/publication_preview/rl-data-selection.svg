<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img">
  <title>An RL policy filtering training data</title>
  <defs>
    <pattern id="dots-rlds" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="23" cy="23" r="1.6" fill="#1E293B"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="#0F172A"/>
  <rect width="600" height="450" fill="url(#dots-rlds)"/>
  <!-- candidate pool -->
  <g fill="#64748B">
    <circle cx="95" cy="110" r="6"/>
    <circle cx="150" cy="160" r="6"/>
    <circle cx="90" cy="222" r="6"/>
    <circle cx="155" cy="285" r="6"/>
    <circle cx="100" cy="345" r="6"/>
    <circle cx="165" cy="82" r="6"/>
    <circle cx="182" cy="222" r="6"/>
  </g>
  <!-- funnel -->
  <g stroke="#818CF8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M240 78 L 385 196"/>
    <path d="M240 372 L 385 254"/>
  </g>
  <!-- policy -->
  <rect x="292" y="197" width="56" height="56" rx="10" transform="rotate(45 320 225)" fill="none" stroke="#818CF8" stroke-width="4"/>
  <circle cx="320" cy="225" r="6" fill="#E2E8F0"/>
  <!-- selected data -->
  <g fill="#818CF8">
    <circle cx="452" cy="225" r="8"/>
    <circle cx="498" cy="200" r="8"/>
    <circle cx="498" cy="250" r="8"/>
  </g>
  <rect x="30" y="400" width="34" height="6" rx="3" fill="#818CF8"/>
</svg>
